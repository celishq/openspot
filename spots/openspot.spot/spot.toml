[scripts.actions]
title = "Card actions"
icon = "ellipsis.circle"
detail = "Share, set, edit, change the icon of, delete or turn off a spot"
uses = ["spots"]

[scripts.actions.commands.share]
title = "Share"
shortcut = "cmd+shift+c"
offers = ["actions mine, core"]

[scripts.actions.commands.settings]
title = "Settings"
shortcut = "cmd+return"
close = false
offers = ["actions"]

[scripts.actions.commands.edit]
title = "Edit"
shortcut = "cmd+e"
close = false
offers = ["actions mine, core"]

[scripts.actions.commands.icon]
title = "Change Icon"
offers = ["actions"]

[scripts.actions.commands."icon.draw"]
title = "Draw…"
close = false

[scripts.actions.commands."icon.file"]
title = "Choose File…"
close = false

[scripts.actions.commands."icon.reset"]
title = "Reset Icon"
close = false
when = "hasIcon"

[scripts.actions.commands.delete]
title = "Delete"
shortcut = "cmd+backspace"
close = false
offers = ["actions mine"]

[scripts.actions.commands.off]
title = "Turn off"
shortcut = "cmd+backspace"
offers = ["actions core"]

[scripts.icon]
title = "Icon"
icon = "paintbrush.pointed"
detail = "Draw the icon of a spot"
on = ["sheet.open"]
views = ["board.swift"]
uses = ["spots"]
drop = "png,jpg,jpeg,heic,gif,tiff,svg,pdf,icns"

[scripts.new]
title = "New spot"
icon = "plus"
detail = "Make your own"
on = ["sheet.open", "search.text \\S"]
answers = "last"
uses = ["clipboard"]
edits = "spots"

[scripts.playground]
title = "Playground"
icon = "hammer"
detail = "Try a spot and see each call"
keywords = ["sandbox"]

[scripts.playground.commands.playground]
title = "Open Playground"

[scripts.quit]
title = "Quit"
icon = "power"
detail = "Openspot"
uses = ["app"]

[scripts.quit.commands.quit]
title = "Quit"

[scripts.settings]
title = "Settings"
icon = "gearshape"
detail = "Choose your key"
uses = ["app"]
offers = ["search"]

[scripts.spots]
title = "Spots"
icon = "puzzlepiece.extension"
detail = "Edit Spots"
keywords = ["edit spots"]

[scripts.spots.commands.edit]
title = "Edit Spots"

[scripts.store]
title = "Store"
icon = "bag"
detail = "Get spots"
keywords = ["store", "get spots"]
on = ["sheet.open"]
uses = ["spots", "account"]
views = ["store.swift"]

[scripts.themes]
title = "Themes"
icon = "paintpalette"
detail = "Change the look"
keywords = ["theme", "look"]
on = ["sheet.open"]
uses = ["app", "clipboard"]
pages = ["prompt:*"]

[scripts.updates]
title = "Updates"
icon = "arrow.triangle.2.circlepath"
on = ["app.launch", "app.update"]
uses = ["app"]

[scripts.updates.commands.update]
title = "Update"

[scripts.welcome]
title = "Welcome spot"
icon = "hand.wave"
on = ["sheet.open"]
uses = ["app"]
starts = "first-launch"
views = ["welcome.swift"]
pages = ["key", "agent"]

[scripts.snooze]
title = "Snooze"
icon = "moon.zzz"
detail = "Pick a time for later"
pages = ["date", "date/*"]

[scripts.snooze.on]
"sheet.open" = true

[scripts.snooze.actions.pick]
inputs.title = { type = "text", description = "What the time is for, as the title of the sheet" }
outputs.until = { type = "text", required = true, description = "An ISO 8601 time with its offset, or someday" }

[scripts.snooze.settings]
morning = { type = "choice", title = "Morning", icon = "sunrise", options = ["6:00", "7:00", "8:00", "9:00", "10:00"] }
evening = { type = "choice", title = "Evening", icon = "moon.stars", options = ["17:00", "18:00", "19:00", "20:00", "21:00"] }
later = { type = "choice", title = "Later", icon = "cup.and.saucer", options = ["1 hour", "2 hours", "3 hours", "4 hours", "6 hours"] }
weekend = { type = "choice", title = "Weekend", icon = "sofa", options = ["Saturday", "Sunday"] }
