icon = "link"
detail = "Open a link"
uses = ["network", "clipboard"]
pages = ["query:*"]

[actions.new]
inputs.url = { type = "text", description = "example.com or ~/Downloads" }
inputs.title = "text"

[actions.import]
inputs.links = { type = "text", required = true, description = "A JSON list of links, each with a title and a url" }
outputs.added = { type = "text", required = true, description = "How many links it added, in words" }

[actions.add]
title = "Add to Links"
offers = ["attachments"]
inputs.url = { type = "url", required = true, description = "The link to keep" }
inputs.title = "text"

[on]
"panel.open" = true
search = true
