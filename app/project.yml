name: Openspot
options:
  bundleIdPrefix: dev.openspot
  deploymentTarget:
    macOS: "26.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: NNK86LQK58
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    UPDATE_PUBLIC_KEY: ""
    OPENSPOT_DEV_STATE: ""
targets:
  OpenspotCore:
    type: library.static
    platform: macOS
    sources:
      - path: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openspot.core
        DEFINES_MODULE: YES
  Openspot:
    type: application
    platform: macOS
    sources:
      - path: Shell
    dependencies:
      - target: OpenspotCore
      - package: Sparkle
    info:
      path: Shell/Info.plist
      properties:
        CFBundleName: Openspot
        CFBundleDisplayName: Openspot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        SUFeedURL: https://github.com/celishq/openspot/releases/latest/download/appcast.xml
        SUPublicEDKey: $(UPDATE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUVerifyUpdateBeforeExtraction: true
        OpenspotDevState: $(OPENSPOT_DEV_STATE)
        NSAppleEventsUsageDescription: Openspot runs your plugins, and a plugin can ask another app to act, such as to paste.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Openspot spot
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - dev.openspot.spot
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.openspot.spot
            UTTypeDescription: Openspot spot
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - spot
    entitlements:
      path: Shell/Openspot.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    postBuildScripts:
      - name: Link the openspot command
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          ln -sfn ../MacOS/Openspot "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/openspot"
      - name: Fill the dev state
        basedOnDependencyAnalysis: false
        script: |
          if [ -n "$OPENSPOT_DEV_STATE" ] && [ ! -e "$OPENSPOT_DEV_STATE/plugins" ]; then
            mkdir -p "$OPENSPOT_DEV_STATE"
            cp -R "$SRCROOT/../plugins" "$OPENSPOT_DEV_STATE/plugins"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: openspot.celis.ai
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconNightly
          ENABLE_HARDENED_RUNTIME: NO
          OPENSPOT_DEV_STATE: $(SRCROOT)/../.temp/openspot
  OpenspotStandIn:
    type: tool
    platform: macOS
    sources:
      - path: StandIn
    dependencies:
      - target: OpenspotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openspot.standin
  OpenspotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: OpenspotCore
      - target: OpenspotStandIn
        link: false
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openspot.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Openspot:
    build:
      targets:
        Openspot: all
        OpenspotCore: all
    run:
      config: Debug
    test:
      environmentVariables:
        OPENSPOT_SH: $(SRCROOT)/Shell/openspot.sh
        HOME: $(SRCROOT)/../.temp/test-home
      targets:
        - name: OpenspotTests
          parallelizable: true
