name: Openspot
options:
  bundleIdPrefix: dev.openspot
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  OpenspotCore:
    type: library.static
    platform: macOS
    sources:
      - path: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openspot.core
        DEFINES_MODULE: YES
  Openspot:
    type: application
    platform: macOS
    sources:
      - path: Shell
    dependencies:
      - target: OpenspotCore
    info:
      path: Shell/Info.plist
      properties:
        CFBundleName: Openspot
        CFBundleDisplayName: Openspot
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openspot.app
        DEVELOPMENT_TEAM: ""
  OpenspotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: OpenspotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openspot.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Openspot:
    build:
      targets:
        Openspot: all
        OpenspotCore: all
    test:
      targets:
        - OpenspotTests
