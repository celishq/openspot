name: Openspot
options:
  bundleIdPrefix: dev.openspot
  deploymentTarget:
    macOS: "26.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
  secp256k1:
    url: https://github.com/21-DOT-DEV/swift-secp256k1
    exactVersion: 0.24.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    OTHER_SWIFT_FLAGS: $(inherited) -Xcc -fmodule-map-file=$(GENERATED_MODULEMAP_DIR)/libsecp256k1.modulemap
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: NNK86LQK58
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    UPDATE_PUBLIC_KEY: ""
    OPENSPOT_DEV_STATE: ""
targets:
  OpenspotCore:
    type: library.static
    platform: macOS
    sources:
      - path: Core
      - path: Client/CommandKind.swift
      - path: Client/SocketPath.swift
    dependencies:
      - package: secp256k1
        product: P256K
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openspot.core
        DEFINES_MODULE: YES
  Openspot:
    type: application
    platform: macOS
    sources:
      - path: Shell
    dependencies:
      - target: OpenspotCore
      - package: secp256k1
        product: P256K
      - package: Sparkle
      - target: OpenspotClient
        link: false
        embed: false
    info:
      path: Shell/Info.plist
      properties:
        CFBundleName: Openspot
        CFBundleDisplayName: Openspot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        SUFeedURL: https://github.com/celishq/openspot/releases/latest/download/appcast.xml
        SUPublicEDKey: $(UPDATE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUVerifyUpdateBeforeExtraction: true
        OpenspotDevState: $(OPENSPOT_DEV_STATE)
        NSAppleEventsUsageDescription: Openspot runs your spots, and a spot can ask another app to act, such as to paste.
        NSMicrophoneUsageDescription: Openspot records the microphone when a plugin records the screen with your voice, or when you dictate.
        NSCameraUsageDescription: Openspot records the camera when a plugin records the screen with your camera.
        NSCalendarsFullAccessUsageDescription: Openspot shows and adds your events when a spot that you use asks for them.
        NSRemindersFullAccessUsageDescription: Openspot shows, adds and ticks your reminders when a spot that you use asks for them.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Openspot spot
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - dev.openspot.spot
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.openspot.spot
            UTTypeDescription: Openspot spot
            UTTypeConformsTo:
              - public.data
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - spot
    entitlements:
      path: Shell/Openspot.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
        com.apple.security.personal-information.calendars: true
    postBuildScripts:
      - name: Copy the openspot command
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          rm -f "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/openspot"
          cp "$BUILT_PRODUCTS_DIR/openspot" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/openspot"
      - name: Join the guide, and copy the guides of the nouns
        basedOnDependencyAnalysis: false
        script: |
          sh "$SRCROOT/../scripts/guide.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GUIDE.md"
          rm -rf "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Help"
          cp -R "$SRCROOT/Help" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Help"
      - name: Copy the core spots and their defaults
        basedOnDependencyAnalysis: false
        script: |
          core="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/spots"
          rm -rf "$core"
          mkdir -p "$(dirname "$core")"
          cp -RL "$SRCROOT/../spots" "$core"
          cp "$SRCROOT/defaults.toml" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/defaults.toml"
      - name: Copy the emoji keywords
        basedOnDependencyAnalysis: false
        script: |
          keywords="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Keywords"
          rm -rf "$keywords"
          cp -R "$SRCROOT/Keywords" "$keywords"
      - name: Fill the dev state
        basedOnDependencyAnalysis: false
        script: |
          if [ -n "$OPENSPOT_DEV_STATE" ] && [ ! -e "$OPENSPOT_DEV_STATE/spots" ] && [ -e "$OPENSPOT_DEV_STATE/plugins" ]; then
            mv "$OPENSPOT_DEV_STATE/plugins" "$OPENSPOT_DEV_STATE/spots"
          fi
          if [ -n "$OPENSPOT_DEV_STATE" ] && [ ! -e "$OPENSPOT_DEV_STATE/spots" ]; then
            mkdir -p "$OPENSPOT_DEV_STATE"
            cp -R "$SRCROOT/../spots" "$OPENSPOT_DEV_STATE/spots"
            rm -rf "$OPENSPOT_DEV_STATE/spots/openspot.spot"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: openspot.celis.ai
        DEVELOPMENT_TEAM: ""
        INFOPLIST_OUTPUT_FORMAT: XML
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconNightly
          ENABLE_HARDENED_RUNTIME: NO
          OPENSPOT_DEV_STATE: $(SRCROOT)/../.temp/openspot
  OpenspotClient:
    type: tool
    platform: macOS
    sources:
      - path: Client
    settings:
      base:
        PRODUCT_NAME: openspot
        PRODUCT_BUNDLE_IDENTIFIER: dev.openspot.client
        SKIP_INSTALL: YES
        LD_OBJC_RUNTIME_ARGS: ""
  OpenspotStandIn:
    type: tool
    platform: macOS
    sources:
      - path: StandIn
    dependencies:
      - target: OpenspotCore
      - package: secp256k1
        product: P256K
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openspot.standin
  OpenspotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: OpenspotCore
      - package: secp256k1
        product: P256K
      - target: OpenspotStandIn
        link: false
        embed: false
      - target: OpenspotClient
        link: false
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openspot.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Openspot:
    build:
      targets:
        Openspot: all
        OpenspotCore: all
    run:
      config: Debug
    test:
      environmentVariables:
        OPENSPOT_SH: $(SRCROOT)/Shell/openspot.sh
        HOME: $(SRCROOT)/../.temp/test-home
      targets:
        - name: OpenspotTests
          parallelizable: true
