name: Openspot
options:
  bundleIdPrefix: dev.openspot
  deploymentTarget:
    macOS: "26.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: NNK86LQK58
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    UPDATE_PUBLIC_KEY: ""
targets:
  OpenspotCore:
    type: library.static
    platform: macOS
    sources:
      - path: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openspot.core
        DEFINES_MODULE: YES
  Openspot:
    type: application
    platform: macOS
    sources:
      - path: Shell
    dependencies:
      - target: OpenspotCore
      - package: Sparkle
    info:
      path: Shell/Info.plist
      properties:
        CFBundleName: Openspot
        CFBundleDisplayName: Openspot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        SUFeedURL: https://github.com/celishq/openspot/releases/latest/download/appcast.xml
        SUPublicEDKey: $(UPDATE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUVerifyUpdateBeforeExtraction: true
        NSAppleEventsUsageDescription: Openspot runs your plugins, and a plugin can ask another app to act, such as to paste.
    entitlements:
      path: Shell/Openspot.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    postBuildScripts:
      - name: Link the openspot command
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          ln -sfn ../MacOS/Openspot "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/openspot"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openspot.app
        DEVELOPMENT_TEAM: ""
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
  OpenspotStandIn:
    type: tool
    platform: macOS
    sources:
      - path: StandIn
    dependencies:
      - target: OpenspotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openspot.standin
  OpenspotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: OpenspotCore
      - target: OpenspotStandIn
        link: false
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openspot.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Openspot:
    build:
      targets:
        Openspot: all
        OpenspotCore: all
    run:
      config: Debug
      environmentVariables:
        OPENSPOT_PLUGINS: $(SRCROOT)/../plugins
        OPENSPOT_CONFIG: $(SRCROOT)/../.temp/config
    test:
      environmentVariables:
        OPENSPOT_SH: $(SRCROOT)/Shell/openspot.sh
      targets:
        - name: OpenspotTests
          parallelizable: true
