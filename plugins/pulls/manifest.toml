name = "Pull requests"
api = 1

[[metrics]]
name = "open"
exec = "pulls.sh"
kind = "rows"
refresh = 120

[[commands]]
name = "Pull requests"
exec = "pulls.sh"
type = "list"
symbol = "arrow.triangle.pull"
subtitle = "Yours and to review"
key = "g"

[[actions]]
command = "Pull requests"
id = "copy"
title = "Copy link"
key = "cmd+return"
after = "close"

[[widgets]]
name = "Pull request status"
layout = "single"
places = ["pulls/open"]
opens = "pulls/Pull requests"
tray = "pulls/open"
