name = "Links"
api = 1

[[commands]]
name = "Links"
exec = "links.sh"
type = "list"
global = true
symbol = "link"
subtitle = "Open a link"
key = "l"

[[actions]]
command = "Links"
id = "copy"
title = "Copy"
key = "cmd+return"
after = "close"

[[actions]]
command = "Links"
id = "reveal"
title = "Show in Finder"
key = "cmd+r"
after = "close"

[[actions]]
command = "Links"
id = "edit"
title = "Edit"
key = "cmd+e"
form = true

[[actions]]
command = "Links"
id = "delete"
title = "Delete"
key = "cmd+backspace"
confirm = "Press again to delete"

[[actions]]
command = "Links"
id = "new"
title = "New link"
key = "cmd+n"
scope = "command"
form = true
