name = "Files"
api = 1

[[commands]]
name = "Files"
exec = "files.sh"
type = "list"
search = "live"
symbol = "doc.text.magnifyingglass"
subtitle = "Find a file"
key = "f"

[[actions]]
command = "Files"
id = "reveal"
title = "Show in Finder"
key = "cmd+return"
after = "close"

[[actions]]
command = "Files"
id = "copy"
title = "Copy path"
key = "cmd+shift+c"
after = "close"
